<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lyriq</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <div class="art">
        <img class="cover" id="cover" alt="" width="220" height="220" />
        <div class="shade">
          <div class="title" id="title">No track</div>
          <div class="artist" id="artist">Play something on YouTube Music</div>
          <div class="status" id="status">No track</div>
        </div>
      </div>
      <div class="footer">
        <label class="toggle">
          <input type="checkbox" id="enabled" />
          <span>Overlay</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="transportEnabled" checked />
          <span>Controls</span>
        </label>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
