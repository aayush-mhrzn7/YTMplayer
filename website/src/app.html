<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#ffffff" />
		<script>
			// Resolve the theme before first paint (saved choice, else the system setting) so the
			// CSS only needs one set of dark colours and there's no flash
			(function () {
				var t = null;
				try {
					t = localStorage.getItem('lyriq-theme');
				} catch (e) {}
				if (t !== 'light' && t !== 'dark') {
					t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.dataset.theme = t;
				document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#000000' : '#ffffff';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
